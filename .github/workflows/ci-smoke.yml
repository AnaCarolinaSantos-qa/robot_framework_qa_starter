name: CI - Smoke e regressão

on:
  workflow_call:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Prepare artifact directory
        run: mkdir -p results/smoke && touch results/smoke/.artifact-placeholder
      - name: Run smoke and regression tests
        run: |
          robot --outputdir results/smoke \
            tests/acceptance_tests \
            tests/functional_tests \
            tests/regression_tests \
            tests/suites
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ github.run_id }}
          path: results/smoke/
          if-no-files-found: ignore
