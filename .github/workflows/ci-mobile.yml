name: CI - Mobile

on:
  workflow_call:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
      - name: Run local mobile tests
        run: robot --outputdir results/mobile -i mobile -e browserstack tests/mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ github.run_id }}
          path: results/mobile/
          if-no-files-found: warn
