name: CI - Mobile

on:
  workflow_call:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Prepare artifact directory
        run: mkdir -p results/mobile && touch results/mobile/.artifact-placeholder
      - name: Run local mobile tests
        run: robot --outputdir results/mobile -i mobile -e browserstack tests/mobile
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ github.run_id }}
          path: results/mobile/
          if-no-files-found: ignore
