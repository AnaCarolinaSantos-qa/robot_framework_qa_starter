name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detectar suítes afetadas
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      mobile: ${{ steps.filter.outputs.mobile }}
      accessibility: ${{ steps.filter.outputs.accessibility }}
      performance: ${{ steps.filter.outputs.performance }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

  api:
    name: API
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml

  ui:
    name: UI (Selenium)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ci-ui.yml

  mobile:
    name: Mobile
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/ci-mobile.yml

  accessibility:
    name: Acessibilidade
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.accessibility == 'true'
    uses: ./.github/workflows/ci-accessibility.yml

  performance:
    name: Performance
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.performance == 'true'
    uses: ./.github/workflows/ci-performance.yml

  smoke:
    name: Smoke e regressão
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.smoke == 'true'
    uses: ./.github/workflows/ci-smoke.yml

  summary:
    name: Resumo
    if: always()
    needs: [changes, api, ui, mobile, accessibility, performance, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        if: always()
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
        if: always()
      - uses: actions/setup-python@v7
        if: always() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped' || needs.mobile.result != 'skipped' || needs.accessibility.result != 'skipped' || needs.smoke.result != 'skipped')
        with:
          python-version: '3.11'
      - name: Prepare dashboard directories
        if: always() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped' || needs.mobile.result != 'skipped' || needs.accessibility.result != 'skipped' || needs.smoke.result != 'skipped')
        run: mkdir -p dashboard-input results/dashboard
      - name: Restore dashboard history
        if: always() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped' || needs.mobile.result != 'skipped' || needs.accessibility.result != 'skipped' || needs.smoke.result != 'skipped')
        uses: actions/cache/restore@v6
        with:
          path: results/dashboard/robot_results.db
          key: robot-dashboard-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: robot-dashboard-${{ github.ref_name }}-
      - name: Download Robot Framework results
        if: always() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped' || needs.mobile.result != 'skipped' || needs.accessibility.result != 'skipped' || needs.smoke.result != 'skipped')
        uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ github.run_id }}'
          path: dashboard-input
          merge-multiple: false
      - name: Generate Robot Framework Dashboard
        id: dashboard
        if: always() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped' || needs.mobile.result != 'skipped' || needs.accessibility.result != 'skipped' || needs.smoke.result != 'skipped')
        run: |
          python -m pip install --disable-pip-version-check robotframework-dashboard==2.5.0
          if find dashboard-input -type f -name 'output.xml' -print -quit | grep -q .; then
            robotdashboard -f dashboard-input \
              -d results/dashboard/robot_results.db \
              -n results/dashboard/robot_dashboard.html \
              --offlinedependencies -u true
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Nenhum output.xml foi publicado; dashboard não gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Robot Framework Dashboard
        if: always() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped' || needs.mobile.result != 'skipped' || needs.accessibility.result != 'skipped' || needs.smoke.result != 'skipped')
        uses: actions/upload-artifact@v7
        with:
          name: robot-dashboard-${{ github.run_id }}
          path: |
            results/dashboard/
            dashboard-input/
          if-no-files-found: ignore
      - name: Save dashboard history
        if: steps.dashboard.outputs.generated == 'true'
        uses: actions/cache/save@v6
        with:
          path: results/dashboard/robot_results.db
          key: robot-dashboard-${{ github.ref_name }}-${{ github.run_id }}
      - name: Write summary
        env:
          API_RESULT: ${{ needs.api.result }}
          UI_RESULT: ${{ needs.ui.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          {
            echo '## ✅ Resumo do CI'
            echo '| Suíte | Resultado |'
            echo '|---|---|'
            echo "| API | ${API_RESULT} |"
            echo "| UI | ${UI_RESULT} |"
            echo "| Mobile | ${MOBILE_RESULT} |"
            echo "| Acessibilidade | ${ACCESSIBILITY_RESULT} |"
            echo "| Performance | ${PERFORMANCE_RESULT} |"
            echo "| Smoke e regressão | ${SMOKE_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
